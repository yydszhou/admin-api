server:
  port: 8080

spring:
  application:
    name: ai
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ai
    username: ai
    password: ai
    driver-class-name: org.postgresql.Driver
  
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Token配置
token:
  expire-hours: 1
